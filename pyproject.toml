[project]
name = "wecomarchive"
version = "0.2.0"
description = "企业微信会话存档、事务游标与异步规则消费框架"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pycryptodome>=3.23.0",
    "pyweworkfinance>=1.1.0",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
mysql = ["pymysql[rsa]>=1.1,<2"]
postgres = ["psycopg[binary]>=3.1,<4"]
examples = ["httpx>=0.27,<1"]

[project.scripts]
wecomarchive-db = "wecomarchive.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "build>=1.2", "ruff>=0.12,<1", "nuitka>=4.2.2"]


[build-system]
requires = ["setuptools>=42", "wheel", "Nuitka[build-wheel]", "toml"]
build-backend = "nuitka.distutils.Build"

[tool.hatch.build.targets.wheel]
packages = ["src/wecomarchive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --basetemp=.pytest_tmp"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.nuitka]
nofollow-import-to = ["*.tests", "*.test"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
wecomarchive = [
    "migrations/env.py",
    "migrations/script.py.mako",
    "migrations/versions/*.py",
]
